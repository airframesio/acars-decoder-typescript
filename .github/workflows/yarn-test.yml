name: Node Test CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The test toolchain (Babel 8) needs Node ^22.18.0 || >=24.11.0. 22 and 24
        # are Maintenance LTS, 26 is Active LTS. Not "latest": setup-node v7
        # resolves it to prereleases (Node 27 alpha). The published package
        # still targets Node 18 (see README).
        node-version: [22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run tests
        run: npm test
